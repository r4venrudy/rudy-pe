name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    name: libFuzzer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure with Clang
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build
          -DBUILD_TESTING=OFF -DRUDY_PE_BUILD_FUZZER=ON
      - name: Build
        run: cmake --build build --target rudy-pe-fuzzer --parallel
      - name: Seed corpus
        run: |
          mkdir -p build/fuzz-corpus
          python3 examples/create_minimal_pe.py build/fuzz-corpus/minimal-pe64
      - name: Fuzz
        run: build/rudy-pe-fuzzer build/fuzz-corpus -max_len=65536 -timeout=2 -rss_limit_mb=1024 -runs=10000
